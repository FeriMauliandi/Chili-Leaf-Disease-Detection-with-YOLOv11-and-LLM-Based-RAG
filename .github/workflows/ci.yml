name: ChiliCare AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov httpx
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r requirements.txt

      - name: Lint Code with Ruff
        run: |
          ruff check src/ backend/ tests/ --ignore E501,F401,F841 || true

      - name: Run Unit Tests with Pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pytest --cov=src --cov=backend --cov-report=term-missing tests/

  docker-build:
    name: Docker Image Build Test
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-docker-action@v3
        with:
          daemon-config: |
            {
              "debug": true
            }

      - name: Build Docker Image
        run: |
          docker build -t chilicare-app:latest .
